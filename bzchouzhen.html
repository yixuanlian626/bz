<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频抽帧工具 · 每秒一帧</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 780px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
            transition: 0.25s ease;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .sub {
            color: #4a5b6e;
            font-size: 0.95rem;
            margin-bottom: 28px;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
            background: #f0f4fe;
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 32px 20px;
            text-align: center;
            background: #fafcff;
            transition: 0.2s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #f0f7ff;
        }
        .upload-area svg {
            width: 48px;
            height: 48px;
            stroke: #3b82f6;
            stroke-width: 1.5;
            fill: none;
        }
        .file-input {
            display: none;
        }
        .file-label {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-weight: 500;
            padding: 12px 28px;
            border-radius: 60px;
            margin: 16px 0 10px;
            transition: 0.15s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            box-shadow: 0 4px 8px rgba(59,130,246,0.2);
        }
        .file-label:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .file-name {
            font-weight: 500;
            color: #0b1e33;
            margin: 10px 0 4px;
            word-break: break-all;
        }
        .file-size {
            color: #5e6f82;
            font-size: 0.9rem;
        }
        .action-bar {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .btn {
            background: #eef2f6;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            color: #1e2b3c;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: #0b1e33;
            color: white;
            box-shadow: 0 4px 10px rgba(11,30,51,0.2);
        }
        .btn-primary:hover {
            background: #1a2f47;
            transform: scale(1.02);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
        }
        .btn-secondary {
            background: #eef2f6;
        }
        .btn-secondary:hover {
            background: #dce3ec;
        }
        .progress-wrapper {
            margin: 24px 0 12px;
            background: #e9edf3;
            border-radius: 40px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-radius: 40px;
            transition: width 0.25s ease;
        }
        .status {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #2a4058;
            margin-top: 4px;
        }
        .frame-grid {
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 16px;
            max-height: 380px;
            overflow-y: auto;
            padding: 4px 2px 8px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        .frame-item {
            background: #f8fafc;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
            border: 1px solid #eef2f6;
            transition: 0.1s;
            text-align: center;
        }
        .frame-item img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #dce3ec;
        }
        .frame-item .frame-label {
            font-size: 0.7rem;
            padding: 6px 0;
            background: white;
            color: #1e2b3c;
            font-weight: 500;
            letter-spacing: 0.3px;
            border-top: 1px solid #eef2f6;
        }
        .empty-hint {
            color: #7e8d9e;
            text-align: center;
            padding: 28px 0;
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }
        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        .badge {
            background: #eef2f6;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #1f3a57;
        }
        @media (max-width: 500px) {
            .card { padding: 20px 16px; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <h1>🖼️ 抽帧工具</h1>
    <div class="sub">上传视频 · 每秒抽取一帧 · 保存为 JPEG</div>

    <!-- 上传区 -->
    <div class="upload-area" id="uploadArea">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <div style="margin: 6px 0 4px; font-weight: 500; color: #0b1e33;">点击选择 或 拖拽视频</div>
        <div style="color: #5e6f82; font-size: 0.9rem;">MP4, WebM, MOV, AVI 等</div>
        <input type="file" id="fileInput" class="file-input" accept="video/*" />
        <div style="margin-top: 12px;">
            <button class="file-label" id="customFileButton">📁 选择视频</button>
        </div>
        <div id="fileInfo" class="file-name" style="margin-top: 12px;">未选择文件</div>
        <div id="fileSize" class="file-size"></div>
    </div>

    <!-- 操作栏 -->
    <div class="action-bar">
        <div>
            <span class="badge" id="frameCountBadge">⏳ 帧数: 0</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <button class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
            <button class="btn btn-primary" id="extractBtn" disabled>⚡ 抽取帧</button>
        </div>
    </div>

    <!-- 进度条 -->
    <div class="progress-wrapper">
        <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
    </div>
    <div class="status">
        <span id="statusText">就绪</span>
        <span id="progressPercent">0%</span>
    </div>

    <!-- 帧缩略图网格 -->
    <div class="frame-grid" id="frameGrid">
        <div class="empty-hint">🎬 上传视频后点击 “抽取帧”</div>
    </div>

    <div class="footer-actions">
        <button class="btn btn-secondary" id="saveAllBtn" disabled style="font-size: 0.9rem;">💾 保存全部帧 (下载 ZIP)</button>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 引用 ----------
        const fileInput = document.getElementById('fileInput');
        const customFileButton = document.getElementById('customFileButton');
        const uploadArea = document.getElementById('uploadArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileSize = document.getElementById('fileSize');
        const extractBtn = document.getElementById('extractBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveAllBtn = document.getElementById('saveAllBtn');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const progressPercent = document.getElementById('progressPercent');
        const frameGrid = document.getElementById('frameGrid');
        const frameCountBadge = document.getElementById('frameCountBadge');

        // ---------- 状态 ----------
        let currentFile = null;               // 当前选中的 File 对象
        let extractedFrames = [];             // 存储 { blob, name, dataURL? }，用于显示 & 保存
        let isProcessing = false;

        // ---------- 辅助 ----------
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        // 更新界面上的帧计数
        function updateFrameCount() {
            const count = extractedFrames.length;
            frameCountBadge.textContent = `🖼️ 帧数: ${count}`;
            saveAllBtn.disabled = (count === 0);
            if (count === 0) {
                // 显示空状态
                if (!document.querySelector('.empty-hint')) {
                    // 但如果网格为空且没有空提示，添加一个
                    const hint = document.createElement('div');
                    hint.className = 'empty-hint';
                    hint.textContent = '🎬 上传视频后点击 “抽取帧”';
                    frameGrid.appendChild(hint);
                }
            } else {
                // 移除空提示
                const hint = frameGrid.querySelector('.empty-hint');
                if (hint) hint.remove();
            }
        }

        // 清理所有帧（内存 + UI）
        function clearAllFrames() {
            // 释放 blob URL
            extractedFrames.forEach(item => {
                if (item.url) {
                    URL.revokeObjectURL(item.url);
                }
            });
            extractedFrames = [];
            frameGrid.innerHTML = `<div class="empty-hint">🎬 上传视频后点击 “抽取帧”</div>`;
            updateFrameCount();
            // 重置进度
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            statusText.textContent = '已清空';
            // 如果抽取按钮因为之前有文件被启用，保持启用
            if (currentFile) {
                extractBtn.disabled = false;
            }
        }

        // 添加帧到网格 (接收 blob 和 帧序号)
        function addFrameToGrid(blob, frameIndex) {
            const url = URL.createObjectURL(blob);
            const item = { blob, name: `frame_${String(frameIndex).padStart(4, '0')}.jpeg`, url };
            extractedFrames.push(item);

            // 创建网格元素
            const div = document.createElement('div');
            div.className = 'frame-item';
            const img = document.createElement('img');
            img.src = url;
            img.alt = `帧 ${frameIndex}`;
            img.loading = 'lazy';
            const label = document.createElement('div');
            label.className = 'frame-label';
            label.textContent = `#${frameIndex}`;

            div.appendChild(img);
            div.appendChild(label);
            frameGrid.appendChild(div);
            updateFrameCount();
        }

        // ---------- 核心抽帧函数 (每秒抽一帧) ----------
        function extractFramesFromVideo(file) {
            if (!file) return;
            if (isProcessing) return;
            isProcessing = true;
            extractBtn.disabled = true;
            statusText.textContent = '⏳ 解码中...';
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';

            // 先清空旧帧 (保留文件)
            clearAllFrames();

            const video = document.createElement('video');
            video.preload = 'auto';
            video.muted = true;  // 防止自动播放干扰

            const objectURL = URL.createObjectURL(file);
            video.src = objectURL;

            // 当元数据加载完成，获取视频时长、宽高等
            video.onloadedmetadata = function() {
                const duration = video.duration;  // 秒
                if (!duration || duration <= 0 || !isFinite(duration)) {
                    statusText.textContent = '⚠️ 无法读取视频时长';
                    isProcessing = false;
                    extractBtn.disabled = false;
                    URL.revokeObjectURL(objectURL);
                    return;
                }

                // 每秒一帧 => 总帧数 = Math.ceil(duration)
                const totalFrames = Math.ceil(duration);
                if (totalFrames === 0) {
                    statusText.textContent = '⚠️ 视频时长过短 (0秒)';
                    isProcessing = false;
                    extractBtn.disabled = false;
                    URL.revokeObjectURL(objectURL);
                    return;
                }

                statusText.textContent = `⏳ 抽取 ${totalFrames} 帧 ...`;
                let frameIndex = 0;        // 从第0秒开始 (即 0s, 1s, 2s ...)
                let capturedCount = 0;

                // 使用 canvas 截帧
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 监听 seeked 事件 (每一帧跳转完成)
                function onSeeked() {
                    // 检查是否还有帧需要抽取
                    if (frameIndex >= totalFrames) {
                        // 全部抽取完成
                        finishExtraction();
                        return;
                    }

                    // 设置画布尺寸 (使用视频原始尺寸)
                    const vw = video.videoWidth || 640;
                    const vh = video.videoHeight || 360;
                    canvas.width = vw;
                    canvas.height = vh;
                    ctx.drawImage(video, 0, 0, vw, vh);

                    // 导出为 JPEG (质量 0.92)
                    canvas.toBlob((blob) => {
                        if (blob) {
                            addFrameToGrid(blob, frameIndex);
                            capturedCount++;
                        }
                        // 更新进度
                        const percent = Math.min(100, Math.round(((frameIndex + 1) / totalFrames) * 100));
                        progressBar.style.width = `${percent}%`;
                        progressPercent.textContent = `${percent}%`;
                        statusText.textContent = `⏳ 抽取中 ${capturedCount}/${totalFrames}`;

                        // 移动到下一帧 (时间 = frameIndex)
                        frameIndex++;
                        if (frameIndex < totalFrames) {
                            // 跳转到下一帧 (秒)
                            video.currentTime = frameIndex;
                        } else {
                            // 所有帧已处理完成，但需要确保最后一次 seeked 已经触发。
                            // 不过由于最后一次 seeked 回调里会调用 finishExtraction，这里不用重复调用。
                            // 但是，在最后一帧 toBlob 完成后，帧索引已经 >= totalFrames，需要结束。
                            // 但为了防止最后一次 toBlob 异步时已经完成，使用标志。
                            // 在 finishExtraction 中会处理完成。
                            if (frameIndex >= totalFrames) {
                                finishExtraction();
                            }
                        }
                    }, 'image/jpeg', 0.92);
                }

                // 完成抽取
                function finishExtraction() {
                    if (isProcessing === false) return; // 防止重复完成
                    isProcessing = false;
                    extractBtn.disabled = false;
                    statusText.textContent = `✅ 完成! 共抽取 ${capturedCount} 帧`;
                    progressBar.style.width = '100%';
                    progressPercent.textContent = '100%';
                    // 释放资源
                    video.removeEventListener('seeked', onSeeked);
                    video.pause();
                    URL.revokeObjectURL(objectURL);
                    // 如果抽取结果为空，显示提示
                    if (extractedFrames.length === 0) {
                        frameGrid.innerHTML = `<div class="empty-hint">⚠️ 未抽取到任何帧 (视频可能无法解码)</div>`;
                    }
                    updateFrameCount();
                }

                // 绑定 seeked 事件
                video.addEventListener('seeked', onSeeked);

                // 错误处理
                video.onerror = function(e) {
                    statusText.textContent = '❌ 视频解码错误: ' + (video.error ? video.error.message : '未知');
                    isProcessing = false;
                    extractBtn.disabled = false;
                    URL.revokeObjectURL(objectURL);
                    video.removeEventListener('seeked', onSeeked);
                    console.error('Video error:', e);
                };

                // 开始抽帧: 跳转到第0秒
                video.currentTime = 0;
            };

            // 如果加载元数据失败
            video.onerror = function(e) {
                statusText.textContent = '❌ 无法加载视频元数据';
                isProcessing = false;
                extractBtn.disabled = false;
                URL.revokeObjectURL(objectURL);
                console.error('Load metadata error:', e);
            };

            // 部分浏览器可能不会触发 onloadedmetadata, 加上兜底
            setTimeout(() => {
                if (isProcessing && !video.videoWidth) {
                    statusText.textContent = '⚠️ 加载超时，请检查视频格式';
                    isProcessing = false;
                    extractBtn.disabled = false;
                    URL.revokeObjectURL(objectURL);
                }
            }, 15000);
        }

        // ---------- 保存所有帧为 ZIP (使用 JSZip 轻量) ----------
        function saveAllFramesAsZip() {
            if (extractedFrames.length === 0) {
                alert('没有帧可以保存');
                return;
            }

            // 动态加载 JSZip (如果未加载)
            if (typeof JSZip === 'undefined') {
                statusText.textContent = '⏳ 加载压缩库...';
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = function() {
                    statusText.textContent = '库加载完成';
                    performZip();
                };
                script.onerror = function() {
                    statusText.textContent = '❌ 加载 JSZip 失败，请刷新重试';
                };
                document.head.appendChild(script);
            } else {
                performZip();
            }
        }

        function performZip() {
            const zip = new JSZip();
            const folder = zip.folder('frames');

            extractedFrames.forEach((item, idx) => {
                // item.blob 是 JPEG blob
                folder.file(item.name, item.blob);
            });

            statusText.textContent = '⏳ 打包 ZIP ...';
            zip.generateAsync({ type: 'blob' })
                .then(function(content) {
                    // 下载 zip
                    const link = document.createElement('a');
                    const url = URL.createObjectURL(content);
                    link.href = url;
                    link.download = `frames_${new Date().toISOString().slice(0,10)}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    statusText.textContent = `✅ ZIP 已下载 (${extractedFrames.length} 帧)`;
                })
                .catch(function(err) {
                    statusText.textContent = '❌ 打包失败: ' + err.message;
                    console.error(err);
                });
        }

        // ---------- 文件选择处理 ----------
        function handleFile(file) {
            if (!file) return;
            if (!file.type.startsWith('video/')) {
                alert('请上传视频文件');
                return;
            }
            currentFile = file;
            fileInfo.textContent = `📹 ${file.name}`;
            fileSize.textContent = formatFileSize(file.size);
            extractBtn.disabled = false;
            // 清除旧的帧数据（因为换了文件）
            clearAllFrames();
            statusText.textContent = '已加载视频，点击 "抽取帧"';
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
        }

        // ---------- 事件绑定 ----------
        // 点击选择按钮触发文件选择
        customFileButton.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
            // 重置 input 以便选择相同文件再次触发
            fileInput.value = '';
        });

        // 拖拽支持
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#2563eb';
            uploadArea.style.background = '#eff6ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#cbd5e1';
            uploadArea.style.background = '#fafcff';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#cbd5e1';
            uploadArea.style.background = '#fafcff';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // 抽取按钮
        extractBtn.addEventListener('click', () => {
            if (!currentFile) {
                alert('请先选择视频文件');
                return;
            }
            if (isProcessing) return;
            extractFramesFromVideo(currentFile);
        });

        // 清空按钮
        clearBtn.addEventListener('click', () => {
            if (isProcessing) {
                if (!confirm('正在处理中，确定要清空吗？')) return;
            }
            clearAllFrames();
            // 不清除当前文件，保留选择状态
            if (currentFile) {
                statusText.textContent = '已清空帧，可重新抽取';
            } else {
                statusText.textContent = '已清空';
            }
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
        });

        // 保存全部 (ZIP)
        saveAllBtn.addEventListener('click', saveAllFramesAsZip);

        // 初始化
        updateFrameCount();
        // 预置提示
        statusText.textContent = '就绪';
    })();
</script>
</body>
</html>
